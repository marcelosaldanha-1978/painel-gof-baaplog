<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>__TITULO__</title>
<style>
/* Painel GOF-BaApLog — v2 «Encerramento do exercício» (23/11/2026). Ordem = Portaria SEF/C Ex nº 399/2026:
   prazos (Calendário) -> crédito em tela (6.a) -> liquidação (6.d) -> restos a pagar (6.b). Cada OMDS uma a uma, UG 160 e 167.
   Padrão visual: tipografia do sistema, hierarquia por tamanho e peso, espaço, cor só para estado e sempre com texto. */
:root{--bg:#f5f5f7;--card:#fff;--grp:#f5f5f7;--ink:#1d1d1f;--sec:#6e6e73;--ter:#6e6e73;--sep:#e5e5ea;--fill:#e8e8ed;
--red:#d70015;--orange:#b25000;--green:#248a3d;--blue:#0071e3;--redbg:#fff1f0;--orangebg:#fff4e5;--greenbg:#ecf9ef;
--bar:#0071e3;--bar2:#c7c7cc;--r:22px;--nav:rgba(245,245,247,.8);
--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--grp:#2c2c2e;--ink:#f5f5f7;--sec:#a1a1a6;--ter:#98989d;--sep:#3a3a3c;
--fill:#3a3a3c;--red:#ff453a;--orange:#ff9f0a;--green:#30d158;--blue:#0a84ff;--redbg:rgba(255,69,58,.16);--orangebg:rgba(255,159,10,.16);
--greenbg:rgba(48,209,88,.16);--bar:#0a84ff;--bar2:#48484a;--nav:rgba(0,0,0,.72)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header{padding:52px 0 6px}
.eyebrow{font-size:14px;font-weight:600;color:var(--sec);margin:0 0 6px}
h1{font-size:48px;line-height:1.06;font-weight:700;letter-spacing:-.035em;margin:0}
.lead{font-size:19px;color:var(--sec);margin:12px 0 0;max-width:780px}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--fill);color:var(--ink);max-width:100%}
.pill.red{background:var(--redbg);color:var(--red)}.pill.orange{background:var(--orangebg);color:var(--orange)}.pill.green{background:var(--greenbg);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
section{margin:52px 0 0}
.kicker{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
h2{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:0}
.sub{color:var(--sec);margin:8px 0 20px;max-width:800px}
.card{background:var(--card);border-radius:var(--r);padding:28px 30px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 22px rgba(0,0,0,.05)}
.card+.card{margin-top:16px}
.lbl{font-size:14px;color:var(--sec);margin:0 0 6px}
.big{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.mid{font-size:30px;line-height:1.05;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ter);margin:16px 0 0}
.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--green)}
/* prazos */
.next{display:flex;flex-wrap:wrap;gap:6px 30px;align-items:flex-end}
.tl{display:grid;grid-template-columns:72px 1fr 120px;gap:14px;padding:13px 0;border-top:1px solid var(--sep);align-items:baseline}
.tl .dt{font-weight:600;font-variant-numeric:tabular-nums}
.tl .q{text-align:right;color:var(--sec);font-variant-numeric:tabular-nums;font-size:15px}
.tl .ev{font-size:13px;color:var(--ter)}
.tl.past{opacity:.45}
.timeline{margin:24px 0 0}
/* resumo */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border-radius:var(--r);padding:22px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 22px rgba(0,0,0,.05)}
.tile .mid{margin-top:2px}
.tile .note{margin-top:8px}
/* OMDS uma a uma */
.omds{display:grid;gap:20px}
.oh{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.oh h3{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.028em;margin:0}
.oh .tag{margin-left:auto}
.ot{display:flex;align-items:center;gap:14px;min-width:0}
img.br{width:auto;height:56px;flex:none}
.mini-br{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
img.brs{width:auto;height:20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;padding:5px 12px;border-radius:999px}
.tag.red{background:var(--redbg)}.tag.orange{background:var(--orangebg)}.tag.green{background:var(--greenbg)}
.ugs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ug{background:var(--grp);border-radius:16px;padding:18px 20px}
.ug h4{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
.ug h4 b{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
.ug h4 .un{text-transform:none;letter-spacing:0;font-weight:500}
.ugtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 14px}
.ugtop .lbl{margin:0 0 2px;font-size:13px}
.ugtop .v{font-size:26px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ugtop .cap{font-size:13px;color:var(--sec);text-align:right}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--sep);font-size:15px}
.kv>span{color:var(--sec)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv b small{display:block;font-weight:400;color:var(--sec);font-size:13px;white-space:normal}
.kv b.zero{color:var(--ter);font-weight:400}
.track{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin:-2px 0 4px}
.track i{display:block;height:100%;background:var(--bar);border-radius:2px}
/* navegação fixa (segmentada) */
nav.seg{position:sticky;top:0;z-index:10;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
nav.seg .in{max-width:1080px;margin:0 auto;padding:10px 22px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.seg .in::-webkit-scrollbar{display:none}
nav.seg a{flex:none;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--fill)}
nav.seg a:hover{background:var(--sep)}
nav.seg a .dot{display:inline-block;width:6px;height:6px;margin:0 6px 1px 0;vertical-align:middle}
section,.omds>.card{scroll-margin-top:64px}
details{margin:16px 0 0}
summary{cursor:pointer;color:var(--blue);font-size:15px;font-weight:500;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ›"}
footer{color:var(--sec);font-size:12px;padding:52px 0 40px;overflow-wrap:anywhere;border-top:1px solid var(--sep);margin-top:56px}
footer code{word-break:break-all}
footer details summary{font-size:13px}
.tile .mid,.big{white-space:nowrap}
@media (max-width:860px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:700px){
 header{padding-top:30px}h1{font-size:34px}.lead{font-size:17px}h2{font-size:27px}
 .big{font-size:40px}.mid{font-size:22px}.card{padding:22px 18px}.tile{padding:16px}
 .ugs{grid-template-columns:1fr}.tl{grid-template-columns:58px 1fr}.tl .q{grid-column:2;text-align:left}
 .oh{flex-wrap:wrap}.oh h3{font-size:24px}img.br{height:48px}.ug{padding:16px}
}
@media print{body{background:#fff}.card,.tile{box-shadow:none;border:1px solid #ddd}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="seg" aria-label="Seções"><div class="in" id="nav"></div></nav>
<div class="wrap">
<header>
<p class="eyebrow">__EYEBROW__</p>
<h1>__TITULO_H1__</h1>
<p class="lead" id="lead"></p>
<div class="status" id="status" role="status"></div>
</header>
<main>
<section id="prazos" aria-labelledby="tprazos"></section>
<section id="resumo" aria-labelledby="tresumo"></section>
<section id="omds" aria-labelledby="tomds"></section>
</main>
<footer id="rodape"></footer>
</div>
<script type="application/json" id="dados">__DADOS__</script>
<script type="application/json" id="brasoes">__BRASOES__</script>
<script>
"use strict";
(function(){
var D;
try{D=JSON.parse(document.getElementById("dados").textContent);}catch(e){
 document.querySelector("main").innerHTML='<section><h2>Dados ilegíveis</h2><p class="sub">O bloco de dados embutido está corrompido. Use a última versão boa do painel.</p></section>';return;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function rs(v){return "R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function mi(v){v=Number(v||0);return Math.abs(v)>=1e6?"R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi":"R$ "+(v/1e3).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mil";}
function pc(v){return Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}
function n(v){return Number(v||0).toLocaleString("pt-BR");}
function dbr(iso){if(!iso)return "—";var p=String(iso).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]:esc(iso);}
var hoje=new Date();hoje.setHours(0,0,0,0);
function uteis(iso){if(!iso)return null;var d=new Date(String(iso).slice(0,10)+"T00:00:00"),k=0;while(d<hoje){d.setDate(d.getDate()+1);if(d.getDay()>0&&d.getDay()<6)k++;}return k;}
function idadePill(rot,iso,manual){var a=uteis(iso),c=a===null?"orange":(a<=2?"green":(a<=5?"orange":"red"));
 return '<span class="pill '+c+'"><span class="dot"></span>'+esc(rot)+': dados até '+dbr(iso)+(manual?" · atualização manual":" · diário")+'</span>';}
function sem(s){var m={VERMELHO:["red","Tela vencida"],AMARELO:["orange","Atenção"],VERDE:["green","Em dia"]}[s]||["","—"];
 return '<span class="tag '+m[0]+'"><span class="dot"></span>'+m[1]+'</span>';}
var E=D.encerramento||{},G=D.regua,L=D.liquidacao,B=D.b1;
// mapeia o rótulo do B1 para o da régua/liquidação
var NOME=__NOME_JS__;
var ORDEM=__ORDEM_JS__;
var UGNOME=__UGNOME_JS__;
var BR={};try{BR=JSON.parse(document.getElementById("brasoes").textContent)||{};}catch(e){BR={};}
function slug(s){return "o-"+String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").toLowerCase();}
function brasao(nome,cls){return BR[nome]?'<img class="'+(cls||"br")+'" src="'+BR[nome]+'" alt="Brasão '+esc(nome)+'">':"";}

// ---------- cabeçalho
var tg=(D.meta&&D.meta.fonte_b1==="portal")?"Portal da Transparência (reserva)":"Tesouro Gerencial";
document.getElementById("lead").innerHTML="O que importa acompanhar até 31/12, na ordem da __NORMA_CURTA__: prazos, crédito em tela, liquidação e restos a pagar — de cada OMDS, nas UG 160 e 167.";
var st='<span class="pill">Fonte: '+esc(tg)+'</span>'+idadePill("Empenho e liquidação",L?L.data_dado:B.data_dado,false);
var gManual=!!(G&&/MANUAL/i.test(G.atualizacao||""));
if(G)st+=idadePill("Crédito em tela e RPNP",G.data_dado,gManual);
document.getElementById("status").innerHTML=st;

// ---------- 1. PRAZOS (Calendário da Portaria 399)
(function(){var M=E.marcos||[],el=document.getElementById("prazos");if(!M.length){el.style.display="none";return;}
var fut=M.filter(function(m){return !m.vencido;}),pas=M.filter(function(m){return m.vencido;}),p=fut[0];
var h='<p class="kicker">Calendário · Portaria 399</p><h2 id="tprazos">Prazos</h2><p class="sub">Dias úteis sem sábados, domingos e feriados nacionais. Datas estimadas no Calendário podem mudar por mensagem da D Cont.</p><div class="card">';
if(p){var c=p.dias_uteis<=2?"red":(p.dias_uteis<=5?"orange":"");
 h+='<p class="lbl">Próximo prazo · '+dbr(p.data)+'</p><div class="next"><div class="big '+c+'">'+(p.dias_uteis===0?"Hoje":p.dias_uteis+" dia"+(p.dias_uteis===1?"":"s")+" út"+(p.dias_uteis===1?"il":"eis"))+'</div><div class="mid" style="font-weight:500;max-width:600px;font-size:22px;line-height:1.25">'+esc(p.texto)+'</div></div>';}
h+='<div class="timeline">';
fut.slice(1).forEach(function(m){h+='<div class="tl"><div class="dt">'+dbr(m.data)+'</div><div>'+esc(m.texto)+'<div class="ev">'+esc(m.evento)+'</div></div><div class="q">'+m.dias_uteis+' dias úteis</div></div>';});
h+='</div>';
if(pas.length){h+='<details><summary>'+pas.length+' prazo'+(pas.length>1?"s":"")+' já vencido'+(pas.length>1?"s":"")+'</summary><div class="timeline">';
 pas.forEach(function(m){h+='<div class="tl past"><div class="dt">'+dbr(m.data)+'</div><div>'+esc(m.texto)+'<div class="ev">'+esc(m.evento)+'</div></div><div class="q">vencido</div></div>';});h+='</div></details>';}
el.innerHTML=h+'</div>';})();

// ---------- 2. AS 6 OMDS JUNTAS (resumo de 4 números)
(function(){var el=document.getElementById("resumo"),h='<p class="kicker">Itens 6.a, 6.d e 6.b</p><h2 id="tresumo">As seis OMDS juntas</h2><p class="sub">Quatro números para a decisão. O detalhe de cada OMDS, UG a UG, vem logo abaixo.</p><div class="tiles">';
if(G)h+='<div class="tile"><p class="lbl">Crédito em tela</p><div class="mid">'+mi(G.total.em_tela)+'</div><p class="note"><span class="red">vencido: no mínimo '+mi(G.total.vencido_piso)+'</span><br>tirar da tela; o que sobrar a UGR recolhe (6.a.3)</p></div>';
if(L)h+='<div class="tile"><p class="lbl">Liquidado do empenhado</p><div class="mid">'+pc(L.total.pct_liquidado)+'</div><p class="note">a liquidar '+mi(L.total.a_liquidar)+'<br>liquidar até 29/12 (evento 27)</p></div>';
if(L)h+='<div class="tile"><p class="lbl">A liquidar há mais de 60 dias</p><div class="mid orange">'+mi(L.total.mais60_valor)+'</div><p class="note">'+n(L.total.mais60_ne)+' NE · '+mi(L.total.mais60_sem_nenhuma_liq_valor)+' sem nenhuma liquidação</p></div>';
if(G)h+='<div class="tile"><p class="lbl">Restos a pagar a liquidar</p><div class="mid">'+mi(G.total.rpnp_a_liquidar)+'</div><p class="note">'+(G.total.rpnp_bloqueado?'<span class="red">bloqueado '+rs(G.total.rpnp_bloqueado)+': cancela em 30/12</span>':'sem RPNP bloqueado')+'</p></div>';
el.innerHTML=h+'</div>';
var R=G&&G.referencia_1rm;if(R){el.innerHTML+='<details><summary>Restos a pagar: comparação com a __REF_REGIONAL__</summary><div class="card" style="margin-top:12px"><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+R.indices.map(function(x){return '<div><p class="lbl">'+esc(x.nome)+'</p><div class="mid">'+pc(x.indice)+'</div></div>';}).join("")+'</div><p class="note">'+esc(R.nota)+'</p></div></details>';}
})();

// ---------- 3. OMDS UMA A UMA, UG 160 E 167
(function(){var el=document.getElementById("omds");
var b1={};B.omds.forEach(function(o){b1[NOME[o.omds]||o.rotulo]=o;});
var h='<p class="kicker">Uma a uma</p><h2 id="tomds">Cada OMDS, UG 160 e UG 167</h2><p class="sub">'+(gManual?'Empenho e liquidação são atualizados todo dia útil. Crédito em tela, percentual do crédito recebido e restos a pagar vêm de leitura do TG com data própria.':'Tudo atualizado todo dia útil, direto das assinaturas do Tesouro Gerencial.')+'</p><div class="omds">';
ORDEM.forEach(function(o){var g=G&&G.por_omds[o],l=L&&L.por_omds[o],e=b1[o];if(!g&&!l&&!e)return;
 var ugs=[];[g&&g.por_ug,l&&l.por_ug].forEach(function(x){if(x)Object.keys(x).forEach(function(u){if(ugs.indexOf(u)<0)ugs.push(u);});});
 if(!ugs.length&&e)ugs=[e.ug160,e.ug167];ugs.sort();
 h+='<div class="card" id="'+slug(o)+'"><div class="oh"><div class="ot">'+brasao(o)+'<h3>'+esc(o)+'</h3></div>'+(g?sem(g.semaforo):'')+'</div><div class="ugs">';
 ugs.forEach(function(u){var gu=g&&g.por_ug&&g.por_ug[u],lu=l&&l.por_ug&&l.por_ug[u],is160=u.slice(0,3)==="160";
  var emp=lu?lu.empenhado:(e?(is160?e.valor160:e.valor167):0),nne=e?(is160?e.ne160:e.ne167):null;
  function val(v,cls){return Math.abs(v||0)<0.005?'<b class="zero">—</b>':'<b'+(cls?' class="'+cls+'"':'')+'>'+rs(v);}
  h+='<div class="ug"><h4>UG <b>'+esc(u)+'</b>'+(UGNOME[u]?' <span class="un">· '+esc(UGNOME[u])+'</span><span class="mini-br">'+brasao("Cia Cmdo","brs")+brasao("HCmp","brs")+'</span>':'')+'</h4>';
  // 1º o que a Portaria cobra agora (6.a): crédito em tela e o vencido
  if(gu){var vc=gu.vencido_piso>0.005,cv=gu.vencido_piso>=1000?"red":(vc?"orange":(gu.em_tela>0.005?"":"green"));
   h+='<div class="ugtop"><div><p class="lbl">Crédito em tela</p><div class="v '+cv+'">'+(gu.em_tela>0.005?rs(gu.em_tela):"R$ 0,00")+'</div></div><div class="cap">'+
    (vc?'<span class="'+cv+'">vencido '+(Math.abs(gu.vencido_piso-gu.vencido_teto)<0.01?rs(gu.vencido_piso):rs(gu.vencido_piso)+'<br>a '+rs(gu.vencido_teto))+'</span>':(gu.em_tela>0.005?'nada vencido':'tela zerada'))+'</div></div>';}
  h+='<div class="kv"><span>Empenhado</span><b>'+rs(emp)+'<small>'+(nne!=null?n(nne)+' NE':'')+(gu?(nne!=null?' · ':'')+pc(gu.pct_empenhado)+' do recebido':'')+'</small></b></div>';
  if(lu){h+='<div class="kv"><span>Liquidado</span><b>'+pc(lu.pct_liquidado)+'<small>'+rs(lu.liquidado)+'</small></b></div><div class="track" title="liquidado sobre empenhado"><i style="width:'+Math.min(100,lu.pct_liquidado)+'%"></i></div>';
   h+='<div class="kv"><span>A liquidar</span>'+val(lu.a_liquidar)+(lu.mais60_valor>0.005?'<small class="orange">'+rs(lu.mais60_valor)+' há +60 dias · '+n(lu.mais60_ne)+' NE</small>':'')+(lu.a_liquidar>0.005?'</b>':'')+'</div>';}
  if(gu)h+='<div class="kv"><span>Restos a pagar</span>'+val(gu.rpnp_a_liquidar)+(gu.rpnp_bloqueado?'<small class="red">bloqueado '+rs(gu.rpnp_bloqueado)+'</small>':'')+(gu.rpnp_a_liquidar>0.005?'</b>':'')+'</div>';
  h+='</div>';});
 h+='</div></div>';});
h+='</div>';
el.innerHTML=h;})();

// ---------- rodapé
var f='<p>Norma balizadora: __NORMA_RODAPE__. Sem dado pessoal por construção. Gerado em '+dbr(D.meta.hoje)+'.</p><details><summary>Fontes e método</summary><p>';
(D.meta.fontes||[]).forEach(function(x,i){f+=(i?"; ":"")+esc(x.arquivo)+" ("+dbr(x.data_dado)+", sha256 <code>"+esc(String(x.sha256).slice(0,12))+"</code>)";});
f+='.</p>'+(G?'<p>Crédito em tela e RPNP: '+esc(G.posicao_siafi)+'. '+esc(G.regra_vencido)+'.</p>':'')+(L?'<p>Empenho e liquidação: '+esc(L.fonte)+'; '+esc(L.regra)+'.</p>':'')+'<p>Motor v'+esc(D.meta.versao_motor)+' · hash dos dados <code>__HASH__</code>.</p></details>';
document.getElementById("rodape").innerHTML=f;
// navegação fixa: prazos, resumo e as 6 OMDS
(function(){var nv='<a href="#prazos">Prazos</a><a href="#resumo">As seis juntas</a>';
