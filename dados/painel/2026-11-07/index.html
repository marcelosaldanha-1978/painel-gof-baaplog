<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Painel GOF-BaApLog</title>
<style>
:root{--bg:#EEF0EA;--panel:#FAFBF7;--ink:#1B2119;--muted:#5A6355;--line:#D6DACF;--accent:#4B5E26;
--crit:#A8321F;--warn:#A86400;--ok:#2F6B45;--info:#34597A;--u160:#4B5E26;--u167:#9DB070;--fs:14px;
--titulo:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--corpo:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--corpo)}
header{background:var(--accent);color:#fff;padding:14px 20px}
header h1{font:600 26px/1.1 var(--titulo);margin:0;letter-spacing:.3px}
header p{margin:4px 0 0;opacity:.9}
.faixa{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;background:#F6EBD6;border-bottom:1px solid var(--line)}
.faixa span{font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
h2{font:600 22px/1.2 var(--titulo);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.info{color:var(--info)}
.heroi{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin-bottom:12px}
.num{font:600 40px/1 var(--titulo)}
.rot{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cartao{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff}
.cartao h3{font:600 18px/1.2 var(--titulo);margin:0 0 4px}
.barra{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line);margin:6px 0}
.barra i{display:block;height:100%}
.legenda{font-size:12px;color:var(--muted)}
.legenda b{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px -1px 8px}
svg.mes{width:100%;height:46px;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kpis strong{display:block;font:600 24px/1.1 var(--titulo)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:#F1F3EC}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
td.mono{white-space:nowrap}
.vazio{color:var(--muted);font-style:italic}
details summary{cursor:pointer;color:var(--info);margin:8px 0}
footer{max-width:1180px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
footer code{font-family:var(--mono);word-break:break-all}
@media (max-width:700px){
 table.cards thead{display:none}
 table.cards tr{display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:#fff}
 table.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 10px}
 table.cards td::before{content:attr(data-r);color:var(--muted);font-size:12px}
 .num{font-size:32px}
}
@media print{.faixa,details summary{display:none}section{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 var c=a<=2?"ok":(a<=7?"warn":"crit");return '<span class="chip '+c+'" title="idade do dado">'+esc(rot)+': '+dbr(iso)+' · '+a+' dia'+(a===1?'':'s')+'</span>';}

 return s+'<line x1="0" y1="42.5" x2="'+(12*w)+'" y2="42.5" stroke="var(--line)"/></svg>';}

 '<div class="heroi"><div><div class="rot">Empenhado nas 6 OMDS</div><div class="num">'+mi(b1.total)+'</div></div>'+

b1.omds.slice().sort(function(a,b){return b.total-a.total;}).forEach(function(o){
 var p160=o.total?100*o.valor160/o.total:0;

 '<div class="barra" aria-hidden="true"><i style="width:'+p160+'%;background:var(--u160)"></i><i style="width:'+(100-p160)+'%;background:var(--u167)"></i></div>'+
 '<div class="legenda"><b style="background:var(--u160)"></b>UG '+esc(o.ug160||"160")+' '+R.format(o.valor160)+' ('+o.ne160+' NE)<br>'+
 '<b style="background:var(--u167)"></b>UG '+esc(o.ug167||"167")+' '+R.format(o.valor167)+' ('+o.ne167+' NE)</div>'+meses(o)+
 '<div class="legenda">ritmo mensal de jan a dez, escala comum às 6 OMDS (toque ou passe o mouse para o valor)</div></div>';});
h+='</div><details><summary>Tabela (mesmos números)</summary><table class="cards"><thead><tr><th>OMDS</th><th class="n">UG 160</th><th class="n">UG 167</th><th class="n">Total</th><th class="n">NE</th></tr></thead><tbody>';
b1.omds.forEach(function(o){h+='<tr><td data-r="OMDS">'+esc(o.rotulo)+'</td><td class="n" data-r="UG 160">'+R.format(o.valor160)+'</td><td class="n" data-r="UG 167">'+R.format(o.valor167)+'</td><td class="n" data-r="Total">'+R.format(o.total)+'</td><td class="n" data-r="NE">'+o.ne+'</td></tr>';});
h+='<tr><th>Total</th><th></th><th></th><th class="n">'+R.format(b1.total)+'</th><th class="n">'+b1.ne+'</th></tr></tbody></table></details>';
document.getElementById("b1").innerHTML=h;

var b3=D.b3,r=b3.resumo,k=b3.kpis_painel||{};

 '<div><span class="rot">Não publicados</span><strong>'+r.nao_publicados+'</strong></div>'+
 '<div><span class="rot">Score BSC (Painel)</span><strong>'+esc(k.score_bsc||"—")+'</strong><span class="legenda">'+esc(k.classe||"")+'</span></div></div>'+
 '<table class="cards"><thead><tr><th>Processo</th><th>Objeto</th><th>UGG</th><th>Fase</th><th class="n">Estimado</th><th class="n">Homologado</th><th>Prazo meta</th><th>Prazo</th><th>PNCP</th></tr></thead><tbody>';

 h+='<tr><td data-r="Processo" class="mono">'+esc(p.processo)+'</td><td data-r="Objeto">'+esc(p.objeto)+'</td><td data-r="UGG">'+esc(p.ugg==="1oDSup"?"1º D Sup":p.ugg)+'</td><td data-r="Fase">'+esc(p.fase)+' · '+esc(p.pct_total)+'</td>'+
 '<td class="n" data-r="Estimado">'+(p.estimado!=null?R.format(p.estimado):"—")+'</td><td class="n" data-r="Homologado">'+(p.homologado!=null?R.format(p.homologado):"—")+'</td>'+
 '<td data-r="Prazo meta">'+esc(p.prazo_meta)+'</td><td data-r="Prazo"><span class="chip '+cp+'">'+esc(p.status_prazo)+'</span></td><td data-r="PNCP"><span class="chip '+cs+'">'+esc(p.situacao_pncp)+'</span></td></tr>';});

if(a.a_vencer.length){h+='<table class="cards"><thead><tr><th>Processo</th><th>Ata</th><th>Fim da vigência</th><th class="n">Dias</th></tr></thead><tbody>';
 a.a_vencer.forEach(function(x){h+='<tr><td data-r="Processo">'+esc(x.processo)+'</td><td data-r="Ata">'+esc(x.ata)+'</td><td data-r="Fim">'+dbr(x.vigencia_fim)+'</td><td class="n" data-r="Dias">'+x.dias+'</td></tr>';});h+='</tbody></table>';}
else{h+='<p class="vazio">Nenhuma das '+a.n_vigentes+' atas vigentes vence em até '+a.limite_dias+' dias.'+(a.proxima?' A próxima: '+esc(a.proxima.processo)+', ata '+esc(a.proxima.ata)+', em '+dbr(a.proxima.vigencia_fim)+' ('+a.proxima.dias+' dias).':'')+'</p>';}
h+='<h3>Processos atrasados ou suspensos</h3><table class="cards"><thead><tr><th>Processo</th><th>Objeto</th><th>Situação</th><th>Próxima ação</th></tr></thead><tbody>';
b4.processos.forEach(function(p){h+='<tr><td data-r="Processo" class="mono">'+esc(p.processo)+'</td><td data-r="Objeto">'+esc(p.objeto)+'</td><td data-r="Situação"><span class="chip '+(p.situacao_pncp==="Suspenso"?"warn":"crit")+'">'+esc(p.status_prazo)+' · '+esc(p.situacao_pncp)+'</span></td><td data-r="Próxima ação">'+esc(p.proxima_acao)+'</td></tr>';});
h+='</tbody></table>';
var nv=b4.ne_verificar,rot={ALERTA:"Alerta",AMBIGUO:"Ambíguo",CITADO_SEM_ATA:"Citado sem ata"},cls={ALERTA:"crit",AMBIGUO:"warn",CITADO_SEM_ATA:"info"};
h+='<h3>NE a verificar ('+esc(nv.regra)+')</h3><p class="sub">Alerta: cita pregão e UASG, favorecido fora das atas. Ambíguo: fornecedor com ata em mais de um pregão, não atribuído. Citado sem ata: número citado, favorecido fora das atas (colisão de número ou compra fora de ata). Nenhum entra em soma.</p>'+
 '<table class="cards"><thead><tr><th>Nível</th>'+["BaApLog","BCMS","BMSA","ECT","DCMun","1oDSup"].map(function(o){return '<th class="n">'+(o==="1oDSup"?"1º D Sup":o)+'</th>';}).join("")+'</tr></thead><tbody>';
Object.keys(nv.contagem).forEach(function(n){h+='<tr><td data-r="Nível"><span class="chip '+cls[n]+'">'+rot[n]+'</span></td>'+["BaApLog","BCMS","BMSA","ECT","DCMun","1oDSup"].map(function(o){return '<td class="n" data-r="'+(o==="1oDSup"?"1º D Sup":o)+'">'+nv.contagem[n][o]+'</td>';}).join("")+'</tr>';});
h+='</tbody></table><details><summary>Lista das '+nv.lista.length+' NE</summary><table class="cards"><thead><tr><th>NE</th><th>OMDS</th><th>Emissão</th><th class="n">Valor</th><th>Nível</th><th>Pregão(ões)</th></tr></thead><tbody>';
nv.lista.forEach(function(x){h+='<tr><td data-r="NE" class="mono">'+esc(x.documento)+'</td><td data-r="OMDS">'+esc(x.omds==="1oDSup"?"1º D Sup":x.omds)+'</td><td data-r="Emissão">'+esc(x.data)+'</td><td class="n" data-r="Valor">'+R.format(x.valor)+'</td><td data-r="Nível"><span class="chip '+cls[x.nivel]+'">'+rot[x.nivel]+'</span></td><td data-r="Pregão">'+esc(x.pregoes.join(" | "))+'</td></tr>';});
h+='</tbody></table></details><h3>Pendências do coordenador</h3><table class="cards"><thead><tr><th>ID</th><th>Grau</th><th>O que decidir</th><th>Desde</th></tr></thead><tbody>';
b4.pendencias.forEach(function(p){h+='<tr><td data-r="ID" class="mono">'+esc(p.id)+'</td><td data-r="Grau"><span class="chip '+(p.grau==="ALTO"?"crit":"warn")+'">'+esc(p.grau)+'</span></td><td data-r="Decidir">'+esc(p.texto)+'</td><td data-r="Desde">'+dbr(p.desde)+'</td></tr>';});
document.getElementById("b4").innerHTML=h+'</tbody></table>';

h='<p><strong>Fontes:</strong> ';D.meta.fontes.forEach(function(f,i){h+=(i?"; ":"")+esc(f.arquivo)+" ("+dbr(f.data_dado)+', sha256 <code>'+esc(f.sha256.slice(0,12))+'</code>'+(f.observacao?"; "+esc(f.observacao):"")+")";});
h+='.</p><p>Motor v'+esc(D.meta.versao_motor)+' · regra de vínculo v'+esc(D.meta.regra_vinculo)+' · gerado com a data de '+dbr(D.meta.hoje)+' · hash dos dados <code>7a8fec49518dd7f835f114136f2d4f8aa7116f0b7653b932b0793cffbfa201fd</code>. Fora da fase A: percentual sobre o crédito (P-034) e uso das atas (B2).</p>';
document.getElementById("rodape").innerHTML=h;
})();
