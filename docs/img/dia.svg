<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Um dia útil do painel: e-mail do TG às 3h, ponte às 6h, montagem acionada em 2 segundos, página no ar por volta das 6h30; antes, a página saía entre 14h45 e 19h">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d158"/><stop offset=".55" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="antes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity=".15"/><stop offset="1" stop-color="#ff453a" stop-opacity=".55"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif}
      .h{fill:#fff;font-size:17px;font-weight:700}
      .s{fill:#a1a1aa;font-size:13px}
      .t{fill:#e5e7eb;font-size:13px;font-weight:600}
      .g{stroke:#ffffff;stroke-opacity:.08}
      .pulse{animation:p 2.2s ease-in-out infinite}
      @keyframes p{0%,100%{r:9}50%{r:13}}
      .run{stroke-dasharray:8 10;animation:d 1.4s linear infinite}
      @keyframes d{to{stroke-dashoffset:-36}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g class="f">
    <text x="50" y="58" fill="#8e8e93" font-size="14" font-weight="600" letter-spacing="2.2">UM DIA ÚTIL DO PAINEL · HORÁRIO DE BRASÍLIA</text>
    <text x="48" y="100" fill="#fff" font-size="34" font-weight="800" letter-spacing="-.8">Do e-mail do Tesouro à página, antes do expediente</text>
  </g>

  <!-- régua de horas: 0h..24h em x 80..1120 (43.33 px/h) -->
  <g class="f">
    <line x1="80" y1="250" x2="1120" y2="250" stroke="#3a3a3c" stroke-width="2"/>
    <g fill="#6e6e73" font-size="12">
      <text x="74" y="276">0h</text><text x="334" y="276">6h</text><text x="594" y="276">12h</text><text x="854" y="276">18h</text><text x="1108" y="276">24h</text>
    </g>
    <g class="g">
      <line x1="80" y1="150" x2="80" y2="260"/><line x1="340" y1="150" x2="340" y2="260"/><line x1="600" y1="150" x2="600" y2="260"/><line x1="860" y1="150" x2="860" y2="260"/><line x1="1120" y1="150" x2="1120" y2="260"/>
    </g>
    <!-- trecho ativo 03h -> 06h30 -->
    <line x1="210" y1="250" x2="362" y2="250" stroke="url(#linha)" stroke-width="6" stroke-linecap="round" class="run"/>
    <!-- marcos -->
    <circle cx="210" cy="250" r="9" fill="#30d158" class="pulse"/>
    <circle cx="340" cy="250" r="9" fill="#64d2ff" class="pulse"/>
    <circle cx="362" cy="250" r="9" fill="#bf5af2" class="pulse"/>
    <!-- reserva -->
    <circle cx="406" cy="250" r="5" fill="none" stroke="#8e8e93" stroke-width="2"/>
    <circle cx="623" cy="250" r="5" fill="none" stroke="#8e8e93" stroke-width="2"/>
    <text x="388" y="300" class="s">07:33 · 12:33 agenda (reserva)</text>

    <!-- cartões -->
    <rect x="120" y="140" width="170" height="78" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="136" y="166" class="h">~03h · TG</text>
    <text x="136" y="188" class="s">5 assinaturas chegam</text>
    <text x="136" y="206" class="s">ao Gmail (SERPRO)</text>

    <rect x="300" y="140" width="190" height="78" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <text x="316" y="166" class="h">~06h · ponte</text>
    <text x="316" y="188" class="s">copia ao Drive privado e</text>
    <text x="316" y="206" class="s">aciona a montagem ⚡ 2 s</text>

    <rect x="500" y="140" width="220" height="78" rx="14" fill="#30d158" fill-opacity=".14" stroke="#30d158" stroke-opacity=".5"/>
    <text x="516" y="166" class="h">~06h30 · página no ar</text>
    <text x="516" y="188" class="s">7 portões em ~3 min;</text>
    <text x="516" y="206" class="s">resumo na execução</text>
    <path d="M500 200 C 430 230, 400 238, 368 246" fill="none" stroke="#30d158" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <!-- antes x depois -->
  <g class="f">
    <text x="50" y="352" fill="#fff" font-size="18" font-weight="700">Antes × depois (hora em que a página ficava pronta)</text>
    <text x="50" y="392" class="t">Antes · só agenda</text>
    <rect x="210" y="376" width="910" height="22" rx="11" fill="#2c2c2e"/>
    <rect x="723" y="376" width="191" height="22" rx="11" fill="url(#antes)"/>
    <text x="728" y="420" class="s">~14h45 a ~19h (19 a 23/11/2026)</text>
    <text x="50" y="462" class="t">Agora · disparo por evento</text>
    <rect x="210" y="446" width="910" height="22" rx="11" fill="#2c2c2e"/>
    <rect x="210" y="446" width="152" height="22" rx="11" fill="url(#linha)"/>
    <text x="370" y="462" fill="#30d158" font-size="14" font-weight="700">~06h30 · ≈ 8 horas antes</text>
    <text x="50" y="500" class="s">Se a ponte não disparar, nada quebra: a agenda publica mais tarde e o vigia abre alerta.</text>
  </g>
</svg>
