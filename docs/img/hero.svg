<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Painel GOF-BaApLog: do Tesouro Gerencial à página, todo dia útil, na nuvem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1a1036"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d6ff"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d158"/>
      <stop offset="0.5" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif}
      .card{fill:#ffffff;fill-opacity:.07;stroke:#ffffff;stroke-opacity:.16}
      .lbl{fill:#ffffff;font-size:17px;font-weight:650}
      .sub{fill:#a1a1aa;font-size:13px}
      .chip{fill:#ffffff;fill-opacity:.09}
      .chipt{fill:#e5e7eb;font-size:13px;font-weight:600}
      .dash{stroke-dasharray:6 8;animation:d 1.6s linear infinite}
      @keyframes d{to{stroke-dashoffset:-28}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow2)"/>

  <!-- cabeçalho -->
  <g class="f">
    <text x="60" y="70" fill="#8e8e93" font-size="15" font-weight="600" letter-spacing="2.4">BAAPLOG · 6 OMDS · 12 UG · EXÉRCITO BRASILEIRO</text>
    <text x="58" y="132" fill="url(#title)" font-size="58" font-weight="800" letter-spacing="-1.6">Painel GOF-BaApLog</text>
    <text x="60" y="172" fill="#d1d5db" font-size="21">Encerramento do exercício de 2026 — crédito em tela, liquidação e restos a pagar,</text>
    <text x="60" y="200" fill="#d1d5db" font-size="21">direto do Tesouro Gerencial, todo dia útil, <tspan fill="#30d158" font-weight="700">na nuvem e sem pessoa na rotina</tspan>.</text>
  </g>

  <!-- fluxo -->
  <path d="M305 300 H345 M590 300 H630 M875 300 H915" stroke="url(#flow)" stroke-width="3" fill="none" class="dash"/>
  <g class="f" filter="url(#sh)">
    <rect class="card" x="60" y="250" width="245" height="100" rx="18"/>
    <rect class="card" x="345" y="250" width="245" height="100" rx="18"/>
    <rect class="card" x="630" y="250" width="245" height="100" rx="18"/>
    <rect class="card" x="915" y="250" width="245" height="100" rx="18"/>
  </g>
  <g class="f">
    <circle cx="86" cy="281" r="8" fill="#30d158" class="pulse"/>
    <text x="102" y="287" class="lbl">Tesouro Gerencial</text>
    <text x="80" y="314" class="sub">5 assinaturas do SERPRO</text>
    <text x="80" y="335" class="sub">entregues por e-mail ~03h</text>
    <circle cx="371" cy="281" r="8" fill="#64d2ff" class="pulse"/>
    <text x="387" y="287" class="lbl">Ponte P-041</text>
    <text x="365" y="314" class="sub">Apps Script · 06h e 11h</text>
    <text x="365" y="335" class="sub">tira favorecido da emissão</text>
    <circle cx="656" cy="281" r="8" fill="#0a84ff" class="pulse"/>
    <text x="672" y="287" class="lbl">7 portões</text>
    <text x="650" y="314" class="sub">GitHub Actions · 2× ao dia</text>
    <text x="650" y="335" class="sub">recálculo ao centavo</text>
    <circle cx="941" cy="281" r="8" fill="#bf5af2" class="pulse"/>
    <text x="957" y="287" class="lbl">Página pública</text>
    <text x="935" y="314" class="sub">GitHub Pages · claro e escuro</text>
    <text x="935" y="335" class="sub">sem dado pessoal</text>
  </g>

  <!-- selos -->
  <g class="f">
    <rect class="chip" x="60" y="372" width="214" height="30" rx="15"/>
    <text x="78" y="392" class="chipt">Portaria SEF/C Ex nº 399/2026</text>
    <rect class="chip" x="286" y="372" width="170" height="30" rx="15"/>
    <text x="304" y="392" class="chipt">Lei nº 14.133/2021</text>
    <rect class="chip" x="468" y="372" width="150" height="30" rx="15"/>
    <text x="486" y="392" class="chipt">Lei nº 4.320/1964</text>
    <rect class="chip" x="630" y="372" width="250" height="30" rx="15"/>
    <circle cx="650" cy="387" r="5" fill="#30d158" class="pulse"/>
    <text x="664" y="392" class="chipt">operação até a 1ª carga de 2027</text>
  </g>
</svg>
