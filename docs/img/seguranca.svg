<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Segurança do painel GOF-BaApLog: zero dado pessoal, só leitura, actions fixadas, sete portões">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140d"/>
      <stop offset="0.6" stop-color="#0b1a24"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.83" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#30d158" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif}
      .chip{fill:#ffffff;fill-opacity:.08;stroke:#ffffff;stroke-opacity:.14}
      .ct{fill:#e5e7eb;font-size:15px;font-weight:600}
      .ring{fill:none;stroke:#30d158;stroke-opacity:.5;animation:r 3s ease-out infinite;transform-origin:990px 175px}
      @keyframes r{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#g1)"/>
  <rect width="1200" height="360" rx="28" fill="url(#g2)"/>

  <g class="f">
    <text x="60" y="68" fill="#8e8e93" font-size="15" font-weight="600" letter-spacing="2.4">PAINEL GOF-BAAPLOG · REPOSITÓRIO PÚBLICO</text>
    <text x="58" y="128" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1.5">Segurança</text>
    <text x="60" y="168" fill="#d1d5db" font-size="21">Público por desenho, <tspan fill="#30d158" font-weight="700">sem dado pessoal por construção</tspan>:</text>
    <text x="60" y="196" fill="#d1d5db" font-size="21">o favorecido é cortado antes de sair da conta Google, e nada é publicado</text>
    <text x="60" y="224" fill="#d1d5db" font-size="21">sem passar pelos sete portões.</text>

    <rect class="chip" x="60" y="262" width="212" height="40" rx="20"/>
    <text x="82" y="288" class="ct">🔒 2 segredos de leitura</text>
    <rect class="chip" x="284" y="262" width="200" height="40" rx="20"/>
    <text x="306" y="288" class="ct">📌 16 actions por SHA</text>
    <rect class="chip" x="496" y="262" width="214" height="40" rx="20"/>
    <text x="518" y="288" class="ct">🧪 zizmor a cada push</text>
    <rect class="chip" x="722" y="262" width="150" height="40" rx="20"/>
    <text x="744" y="288" class="ct">🚫 0 CPF</text>
  </g>

  <!-- escudo -->
  <circle class="ring" cx="990" cy="175" r="110"/>
  <path d="M990 60 L1080 95 V170 C1080 230 1040 272 990 292 C940 272 900 230 900 170 V95 Z" fill="url(#sh)" opacity=".95"/>
  <path d="M990 78 L1064 107 V170 C1064 220 1031 256 990 273 C949 256 916 220 916 170 V107 Z" fill="#0b1220" opacity=".55"/>
  <path d="M950 172 L978 200 L1034 142" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
